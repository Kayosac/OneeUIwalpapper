name: Build APK

# Сборка только по команде: тег v* (git tag v0.8 && git push --tags) или ручной запуск
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secret (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/infowall.keystore"
            echo "INFOWALL_KEYSTORE=$RUNNER_TEMP/infowall.keystore" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ из секрета"
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан — подпись debug-ключом, обновление поверх старой версии не встанет"
          fi

      - name: Build
        env:
          INFOWALL_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$INFOWALL_KEY_PASS" ]; then unset INFOWALL_KEY_PASS; fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk InfoWall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InfoWall
          path: InfoWall.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest InfoWall.apk \
            --target "$GITHUB_SHA" \
            --title "InfoWall ($SHORT)" \
            --notes "Сборка из ${SHORT}: $(git log -1 --pretty=%s)" \
            --latest
